#!/usr/sbin/nft -f
# Layer 2 Encrypted-DNS Bypass Prevention Rules (OpenWrt / Linux nftables)

table inet smarttv_filter {
    chain forward {
        type filter hook forward priority 0; policy accept;

        # 1. Block outbound DoH (TCP 443) to known public DoH bootstrap IPs from Smart-TV VLAN (192.168.30.0/24)
        ip saddr 192.168.30.0/24 ip daddr { 8.8.8.8, 8.8.4.4, 1.1.1.1, 1.0.0.1, 9.9.9.9, 149.112.112.112 } tcp dport 443 drop

        # 2. Block outbound DoT (TCP/UDP 853) from Smart-TV VLAN
        ip saddr 192.168.30.0/24 tcp dport 853 drop
        ip saddr 192.168.30.0/24 udp dport 853 drop

        # 3. Block outbound DNS-over-QUIC (UDP 853 / 8853) from Smart-TV VLAN (Fire TV / Android TV)
        ip saddr 192.168.30.0/24 udp dport { 853, 8853 } drop
    }

    chain prerouting {
        type nat hook prerouting priority -100; policy accept;

        # 4. Force all outbound Port 53 (DNS) queries from Smart-TV VLAN to AdGuard Home (192.168.30.2)
        ip saddr 192.168.30.0/24 ip daddr != 192.168.30.2 udp dport 53 dnat to 192.168.30.2:53
        ip saddr 192.168.30.0/24 ip daddr != 192.168.30.2 tcp dport 53 dnat to 192.168.30.2:53
    }
}
